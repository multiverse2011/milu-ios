name: apple-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    name: ios-tests
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app
          xcodebuild -version
      # xcodegen は mise.toml で手元と同じ版に固定する
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run unit tests on iPhone 17
        env:
          TEST_RUNNER_MILU_SKIP_AUDIO_ONLY_RENDERER_TEST: '1'
        run: |
          mkdir -p DerivedData/results
          # Keychain を使うテストには entitlement が必要なので、証明書不要のアドホック署名を使う
          xcodebuild test -project Milu.xcodeproj -scheme Milu \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath DerivedData/ios \
            -resultBundlePath DerivedData/results/Milu-iOS.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY=-
      # iPhone のシミュレータは PiP を使えず、PiP のテストが飛ばされるので、iPad で走らせる
      - name: Run PiP tests on iPad
        run: |
          xcodebuild test -project Milu.xcodeproj -scheme Milu \
            -destination 'platform=iOS Simulator,name=iPad Air 11-inch (M4)' \
            -derivedDataPath DerivedData/ios \
            -resultBundlePath DerivedData/results/Milu-iPad-PiP.xcresult \
            -only-testing:MiluTests/PictureInPictureTests \
            CODE_SIGN_IDENTITY=-
      - name: Write coverage to job summary
        if: success() || failure()
        run: |
          [ -d DerivedData/results/Milu-iOS.xcresult ] || exit 0
          python3 -I scripts/coverage-summary.py DerivedData/results/Milu-iOS.xcresult >> "$GITHUB_STEP_SUMMARY"
      # UI テスト (App Store のスクリーンショット) は CI で走らせないので、壊れていないかをビルドだけで確かめる
      - name: Build UI tests
        run: |
          xcodebuild build-for-testing -project Milu.xcodeproj -scheme MiluScreenshots \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath DerivedData/ios \
            CODE_SIGN_IDENTITY=-
      - name: Upload test results on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: milu-ios-test-results
          path: DerivedData/results/
          if-no-files-found: warn
          retention-days: 3

  tvos-tests:
    name: tvos-tests
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app
          xcodebuild -version
          xcrun simctl list runtimes
      # xcodegen は mise.toml で手元と同じ版に固定する
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run unit tests on Apple TV 4K
        env:
          TEST_RUNNER_MILU_SKIP_AUDIO_ONLY_RENDERER_TEST: '1'
        run: |
          mkdir -p DerivedData/results
          xcodebuild test -project Milu.xcodeproj -scheme Milu \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (4th generation)' \
            -derivedDataPath DerivedData/tvos \
            -resultBundlePath DerivedData/results/Milu-tvOS.xcresult \
            CODE_SIGN_IDENTITY=-
      - name: Upload test results on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: milu-tvos-test-results
          path: DerivedData/results/
          if-no-files-found: warn
          retention-days: 3
